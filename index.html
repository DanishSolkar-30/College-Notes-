<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Notes Portal</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Explicit Theme Styling */
        body.light-theme { background-color: #f8fafc; color: #1e293b; }
        body.light-theme header, body.light-theme footer { background-color: #ffffff; border-color: #e2e8f0; color: #1e293b; }
        body.light-theme .theme-card { background-color: #ffffff; border-color: #e2e8f0; color: #334155; }
        body.light-theme .theme-input { background-color: #f8fafc; border-color: #cbd5e1; color: #1e293b; }
        body.light-theme .modal-bg { background-color: rgba(15, 23, 42, 0.5); }
        
        body.dark-theme { background-color: #030712; color: #f1f5f9; }
        body.dark-theme header, body.dark-theme footer { background-color: #0f172a; border-color: #1e293b; color: #f1f5f9; }
        body.dark-theme .theme-card { background-color: #0f172a; border-color: #1e293b; color: #e2e8f0; }
        body.dark-theme .theme-input { background-color: #1e293b; border-color: #334155; color: #f1f5f9; }
        body.dark-theme .modal-bg { background-color: rgba(3, 7, 18, 0.7); }
    </style>
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.className = 'dark-mode';
        } else {
            document.documentElement.className = 'light-mode';
        }
    </script>
</head>
<body class="light-theme min-h-screen flex flex-col font-sans transition-colors duration-200">

    <!-- Header Section -->
    <header class="border-b py-5 px-8 shadow-xs sticky top-0 z-10 transition-colors duration-200">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight flex items-center gap-2">
                    <span>📚</span> College Notes Portal
                </h1>
                <p class="text-sm opacity-75">Structured repository for all semesters, lab manuals, and study materials.</p>
            </div>
            
            <div class="flex items-center gap-3 w-full md:w-auto">
                <!-- Global Live Search Bar -->
                <div class="w-full md:w-72">
                    <input type="text" id="searchInput" placeholder="Search any note or subject..." 
                        oninput="handleSearch(this.value)"
                        class="theme-input w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
                <!-- Dark Mode Toggle Button -->
                <button type="button" onclick="toggleDarkMode()" class="p-2.5 rounded-lg border theme-input hover:opacity-80 transition-opacity shrink-0 cursor-pointer" aria-label="Toggle Theme">
                    <span id="themeIcon" class="text-base pointer-events-none">🌙</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Dynamic Container -->
    <main class="max-w-5xl mx-auto w-full p-6 flex-grow">
        
        <!-- Breadcrumb Navigation Bar -->
        <nav id="breadcrumb" aria-label="Breadcrumb" class="text-sm font-medium mb-6 flex items-center gap-2 overflow-x-auto pb-2">
            <!-- Dynamically populated -->
        </nav>

        <!-- Content Grid (Folders & Files) -->
        <div id="contentGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <!-- Loading state -->
            <div class="col-span-full text-center py-16 opacity-60">
                <p class="animate-pulse">Loading repository notes...</p>
            </div>
        </div>
    </main>

    <!-- File Preview Modal Overlay -->
    <div id="previewModal" class="fixed inset-0 modal-bg z-50 hidden flex items-center justify-center p-4 backdrop-blur-xs">
        <div class="theme-card w-full max-w-4xl h-[85vh] rounded-2xl border shadow-2xl flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-150">
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b flex items-center justify-between">
                <div class="flex items-center gap-3 truncate">
                    <span id="modalFileIcon" class="text-2xl">📄</span>
                    <h3 id="modalFileName" class="font-semibold text-base truncate">Document Preview</h3>
                </div>
                <div class="flex items-center gap-2">
                    <a id="modalDownloadBtn" href="#" target="_blank" rel="noopener noreferrer" 
                       class="text-xs px-3 py-1.5 rounded-md font-medium transition-colors bg-indigo-500 text-white hover:bg-indigo-600">
                       Download
                    </a>
                    <button type="button" onclick="closeModal()" class="p-1.5 rounded-lg opacity-70 hover:opacity-100 hover:bg-slate-500/10 cursor-pointer text-lg font-bold" aria-label="Close Modal">
                        ✕
                    </button>
                </div>
            </div>
            <!-- Modal Body Container -->
            <div id="modalBodyContainer" class="flex-grow bg-slate-100 dark:bg-slate-950 flex items-center justify-center relative overflow-hidden">
                <!-- Dynamically injected preview iframe or container -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t py-4 text-center text-xs opacity-60 transition-colors duration-200">
        College Notes Repository • Auto-Synced via GitHub API
    </footer>

    <!-- Application Script Logic -->
    <script>
        const GITHUB_USER = "DanishSolkar-30";
        const GITHUB_REPO = "College-Notes-";
        
        let repoData = { name: "Home", type: "folder", children: [] };
        let currentPath = []; 
        let isSearching = false;
        let searchQuery = "";
        let flatFileList = [];

        document.addEventListener("DOMContentLoaded", () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            setTheme(savedTheme);
            fetchRepoTree();

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeModal();
            });
        });

        function toggleDarkMode() {
            const currentTheme = document.body.classList.contains('dark-theme') ? 'dark' : 'light';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            setTheme(newTheme);
            localStorage.setItem('theme', newTheme);
        }

        function setTheme(theme) {
            const body = document.body;
            const iconSpan = document.getElementById('themeIcon');
            
            if (theme === 'dark') {
                body.classList.remove('light-theme');
                body.classList.add('dark-theme');
                if (iconSpan) iconSpan.textContent = '☀️';
            } else {
                body.classList.remove('dark-theme');
                body.classList.add('light-theme');
                if (iconSpan) iconSpan.textContent = '🌙';
            }
        }

        async function fetchRepoTree() {
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/git/trees/main?recursive=1`);
                if (!response.ok) throw new Error("Failed to fetch repository tree");
                const data = await response.json();
                
                buildFileTree(data.tree);
                render();
            } catch (err) {
                console.error(err);
                document.getElementById('contentGrid').innerHTML = `
                    <div class="theme-card col-span-full text-center py-12 text-red-500 rounded-xl border">
                        <p class="font-medium">Could not automatically load repository contents.</p>
                        <p class="text-xs opacity-75 mt-1">Please verify your repository configuration.</p>
                    </div>`;
            }
        }

        function buildFileTree(gitFiles) {
            let root = { name: "Home", type: "folder", children: [] };
            
            gitFiles.forEach(file => {
                if (file.path === "index.html" || file.path === "notes.json" || file.path.startsWith(".")) return;

                const parts = file.path.split("/");
                let currentLevel = root.children;

                parts.forEach((part, index) => {
                    let existingNode = currentLevel.find(item => item.name === part);
                    const isLast = index === parts.length - 1;

                    if (!existingNode) {
                        if (isLast && file.type === "blob") {
                            const rawUrl = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${file.path}`;
                            const newNode = { name: part, type: "file", path: rawUrl };
                            currentLevel.push(newNode);
                            flatFileList.push({ name: part, path: rawUrl });
                        } else {
                            const newNode = { name: part, type: "folder", children: [] };
                            currentLevel.push(newNode);
                            currentLevel = newNode.children;
                        }
                    } else {
                        if (!isLast) {
                            currentLevel = existingNode.children;
                        }
                    }
                });
            });

            repoData = root;
        }

        function getCurrentFolder() {
            let current = repoData;
            for (let segment of currentPath) {
                if (!current.children) return null;
                current = current.children.find(c => c.name === segment);
                if (!current) return repoData;
            }
            return current;
        }

        function handleSearch(query) {
            searchQuery = query.trim();
            isSearching = searchQuery.length > 0;
            render();
        }

        function navigateTo(index) {
            if (index === -1) {
                currentPath = [];
            } else {
                currentPath = currentPath.slice(0, index + 1);
            }
            isSearching = false;
            document.getElementById('searchInput').value = '';
            render();
        }

        function render() {
            const grid = document.getElementById('contentGrid');
            const breadcrumb = document.getElementById('breadcrumb');
            grid.innerHTML = '';

            if (isSearching) {
                breadcrumb.innerHTML = `
                    <span class="opacity-75 cursor-pointer hover:underline" onclick="navigateTo(-1)">Home</span>
                    <span class="opacity-40">/</span>
                    <span class="text-indigo-500 font-semibold">Search Results for "${searchQuery}"</span>`;

                const matchedFiles = flatFileList.filter(f => f.name.toLowerCase().includes(searchQuery.toLowerCase()));
                
                if (matchedFiles.length === 0) {
                    grid.innerHTML = `
                        <div class="theme-card col-span-full text-center py-16 rounded-xl border">
                            <p class="text-3xl mb-2">🔍</p>
                            <p class="font-medium">No matching notes found</p>
                        </div>`;
                    return;
                }

                matchedFiles.forEach(file => {
                    grid.appendChild(createCard(file));
                });
                return;
            }

            let bHtml = `<span class="opacity-75 cursor-pointer hover:underline" onclick="navigateTo(-1)">Home</span>`;
            currentPath.forEach((segment, index) => {
                bHtml += `<span class="opacity-40">/</span><span class="text-indigo-500 cursor-pointer hover:underline" onclick="navigateTo(${index})">${segment}</span>`;
            });
            breadcrumb.innerHTML = bHtml;

            const folder = getCurrentFolder();
            if (!folder || !folder.children || folder.children.length === 0) {
                grid.innerHTML = `
                    <div class="theme-card col-span-full text-center py-16 rounded-xl border">
                        <p class="text-3xl mb-2">📂</p>
                        <p class="font-medium">This folder is empty</p>
                    </div>`;
                return;
            }

            folder.children.forEach(item => {
                grid.appendChild(createCard(item));
            });
        }

        function createCard(item) {
            const card = document.createElement('div');
            card.className = "theme-card p-4 rounded-xl border shadow-xs hover:shadow-md transition-all flex items-center justify-between group cursor-pointer";

            if (item.type === 'folder') {
                card.innerHTML = `
                    <div class="flex items-center gap-3 truncate">
                        <span class="text-2xl">📁</span>
                        <span class="font-medium group-hover:text-indigo-500 transition-colors truncate">${item.name}</span>
                    </div>
                    <span class="opacity-50 text-sm group-hover:translate-x-1 transition-transform">→</span>`;
                card.onclick = () => {
                    currentPath.push(item.name);
                    render();
                };
            } else {
                let icon = '📄';
                let badgeText = 'PDF';
                let badgeClass = 'bg-red-500/10 text-red-500';
                
                const lowerName = item.name.toLowerCase();
                if (lowerName.endsWith('.docx') || lowerName.endsWith('.doc')) {
                    icon = '📝';
                    badgeText = 'Word';
                    badgeClass = 'bg-blue-500/10 text-blue-500';
                } else if (lowerName.endsWith('.pptx') || lowerName.endsWith('.ppt')) {
                    icon = '📊';
                    badgeText = 'PPT';
                    badgeClass = 'bg-amber-500/10 text-amber-500';
                } else if (lowerName.endsWith('.xlsx') || lowerName.endsWith('.xls')) {
                    icon = '📈';
                    badgeText = 'Excel';
                    badgeClass = 'bg-emerald-500/10 text-emerald-500';
                } else if (lowerName.endsWith('.zip') || lowerName.endsWith('.rar')) {
                    icon = '📦';
                    badgeText = 'Archive';
                    badgeClass = 'bg-purple-500/10 text-purple-500';
                }

                card.innerHTML = `
                    <div class="flex items-center gap-3 truncate">
                        <span class="text-2xl">${icon}</span>
                        <div class="truncate">
                            <span class="font-medium block truncate text-sm">${item.name}</span>
                            <span class="text-[10px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded ${badgeClass}">${badgeText}</span>
                        </div>
                    </div>
                    <button type="button" class="text-xs px-3 py-1.5 rounded-md font-medium transition-colors bg-indigo-500/10 text-indigo-500 hover:bg-indigo-500/20 shrink-0 ml-2 cursor-pointer">
                       Preview
                    </button>`;
                
                card.onclick = (e) => {
                    e.stopPropagation();
                    openModal(item);
                };
            }
            return card;
        }

        function openModal(item) {
            const modal = document.getElementById('previewModal');
            const modalName = document.getElementById('modalFileName');
            const modalIcon = document.getElementById('modalFileIcon');
            const modalDownload = document.getElementById('modalDownloadBtn');
            const bodyContainer = document.getElementById('modalBodyContainer');

            modalName.textContent = item.name;
            modalDownload.href = item.path;

            const lowerName = item.name.toLowerCase();
            let icon = '📄';
            if (lowerName.endsWith('.docx') || lowerName.endsWith('.doc')) icon = '📝';
            else if (lowerName.endsWith('.pptx') || lowerName.endsWith('.ppt')) icon = '📊';
            else if (lowerName.endsWith('.xlsx') || lowerName.endsWith('.xls')) icon = '📈';
            else if (lowerName.endsWith('.zip') || lowerName.endsWith('.rar')) icon = '📦';
            modalIcon.textContent = icon;

            bodyContainer.innerHTML = '';

            if (lowerName.endsWith('.pdf')) {
                // Uses Mozilla's PDF.js built-in web viewer wrapper to correctly render GitHub raw PDFs
                const viewerUrl = `https://mozilla.github.io/pdf.js/web/viewer.html?file=${encodeURIComponent(item.path)}`;
                bodyContainer.innerHTML = `<iframe src="${viewerUrl}" class="w-full h-full border-0"></iframe>`;
            } else {
                bodyContainer.innerHTML = `
                    <div class="text-center p-6">
                        <p class="text-4xl mb-3">${icon}</p>
                        <p class="font-semibold text-lg mb-1">Direct preview not available for this file type</p>
                        <p class="text-sm opacity-75 mb-4">You can download or view it directly in a new tab.</p>
                        <a href="${item.path}" target="_blank" rel="noopener noreferrer" 
                           class="inline-block px-4 py-2 bg-indigo-500 text-white font-medium rounded-lg text-sm hover:bg-indigo-600 transition-colors">
                           Open / Download File
                        </a>
                    </div>`;
            }

            modal.classList.remove('hidden');
        }

        function closeModal() {
            const modal = document.getElementById('previewModal');
            modal.classList.add('hidden');
            document.getElementById('modalBodyContainer').innerHTML = '';
        }
    </script>
</body>
</html>
