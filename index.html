<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Notes Portal</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- Header Section -->
    <header class="bg-white border-b border-slate-200 py-6 px-8 shadow-xs sticky top-0 z-10">
        <div class="max-w-5xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-900">College Notes Portal</h1>
                <p class="text-sm text-slate-500">Automatically synced with your live repository structure.</p>
            </div>
            <!-- Global Live Search Bar -->
            <div class="w-full md:w-80">
                <input type="text" id="searchInput" placeholder="Search any note or subject..." 
                    oninput="handleSearch(this.value)"
                    class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-slate-50/50">
            </div>
        </div>
    </header>

    <!-- Main Dynamic Container -->
    <main class="max-w-5xl mx-auto w-full p-6 flex-grow">
        
        <!-- Breadcrumb Navigation Bar -->
        <nav id="breadcrumb" aria-label="Breadcrumb" class="text-sm font-medium mb-6 flex items-center gap-2 overflow-x-auto pb-2">
            <!-- Dynamically populated -->
        </nav>

        <!-- Content Grid (Folders & Files) -->
        <div id="contentGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
            <!-- Loading state -->
            <div class="col-span-full text-center py-16 text-slate-400">
                <p class="animate-pulse">Fetching your repository folders...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
        College Notes Repository • Auto-Synced via GitHub API
    </footer>

    <!-- Application Script Logic -->
    <script>
        // CONFIGURATION: Change these to match your GitHub username and repository name
        const GITHUB_USER = "DanishSolkar-30";
        const GITHUB_REPO = "College-Notes-";
        
        let repoData = { name: "Home", type: "folder", children: [] };
        let currentPath = []; 
        let isSearching = false;
        let searchQuery = "";
        let flatFileList = []; // Used for instant global search

        // Fetch directory contents directly from GitHub REST API recursively
        async function fetchRepoTree() {
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/git/trees/main?recursive=1`);
                if (!response.ok) throw new Error("Failed to fetch repository tree");
                const data = await response.json();
                
                buildFileTree(data.tree);
                render();
            } catch (err) {
                console.error(err);
                document.getElementById('contentGrid').innerHTML = `
                    <div class="col-span-full text-center py-12 text-red-500 bg-white rounded-xl border border-slate-200">
                        <p class="font-medium">Could not automatically load repository contents.</p>
                        <p class="text-xs text-slate-400 mt-1">Make sure your repo name is correct and public.</p>
                    </div>`;
            }
        }

        // Transforms GitHub's flat file array into a nested folder tree structure
        function buildFileTree(gitFiles) {
            let root = { name: "Home", type: "folder", children: [] };
            
            gitFiles.forEach(file => {
                // Ignore hidden files, index.html itself, or .gitignore elements
                if (file.path === "index.html" || file.path.startsWith(".")) return;

                const parts = file.path.split("/");
                let currentLevel = root.children;

                parts.forEach((part, index) => {
                    let existingNode = currentLevel.find(item => item.name === part);
                    const isLast = index === parts.length - 1;

                    if (!existingNode) {
                        if (isLast && file.type === "blob") {
                            // It's a file
                            const rawUrl = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${file.path}`;
                            const newNode = { name: part, type: "file", path: rawUrl };
                            currentLevel.push(newNode);
                            flatFileList.push({ name: part, path: rawUrl });
                        } else {
                            // It's a folder
                            const newNode = { name: part, type: "folder", children: [] };
                            currentLevel.push(newNode);
                            currentLevel = newNode.children;
                        }
                    } else {
                        if (!isLast) {
                            currentLevel = existingNode.children;
                        }
                    }
                });
            });

            repoData = root;
        }

        function getCurrentFolder() {
            let current = repoData;
            for (let segment of currentPath) {
                if (!current.children) return null;
                current = current.children.find(c => c.name === segment);
            }
            return current;
        }

        function handleSearch(query) {
            searchQuery = query.trim();
            isSearching = searchQuery.length > 0;
            render();
        }

        function render() {
            const grid = document.getElementById('contentGrid');
            const breadcrumb = document.getElementById('breadcrumb');
            grid.innerHTML = '';

            // 1. Render Search Results View
            if (isSearching) {
                breadcrumb.innerHTML = `
                    <span class="text-slate-500 cursor-pointer hover:underline" onclick="clearSearch()">Home</span>
                    <span class="text-slate-300">/</span>
                    <span class="text-indigo-600 font-semibold">Search Results for "${searchQuery}"</span>`;

                const matchedFiles = flatFileList.filter(f => f.name.toLowerCase().includes(searchQuery.toLowerCase()));
                
                if (matchedFiles.length === 0) {
                    grid.innerHTML = `
                        <div class="col-span-full text-center py-16 bg-white rounded-xl border border-slate-200">
                            <p class="text-3xl mb-2">🔍</p>
                            <p class="text-slate-600 font-medium">No matching notes found</p>
                        </div>`;
                    return;
                }

                matchedFiles.forEach(file => {
                    grid.appendChild(createCard(file));
                });
                return;
            }

            // 2. Render Breadcrumbs
            let bHtml = `<span class="text-slate-600 cursor-pointer hover:underline" onclick="currentPath=[]; render();">Home</span>`;
            let pathAccumulator = [];
            currentPath.forEach(segment => {
                pathAccumulator.push(segment);
                let pCopy = [...pathAccumulator];
                bHtml += `<span class="text-slate-300">/</span><span class="text-indigo-600 cursor-pointer hover:underline" onclick="currentPath = ${JSON.stringify(pCopy)}; render();">${segment}</span>`;
            });
            breadcrumb.innerHTML = bHtml;

            // 3. Render Folder Contents
            const folder = getCurrentFolder();
            if (!folder || !folder.children || folder.children.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-16 bg-white rounded-xl border border-slate-200">
                        <p class="text-3xl mb-2">📂</p>
                        <p class="text-slate-600 font-medium">This folder is empty</p>
                    </div>`;
                return;
            }

            folder.children.forEach(item => {
                grid.appendChild(createCard(item));
            });
        }

        function createCard(item) {
            const card = document.createElement('div');
            card.className = "bg-white p-4 rounded-xl border border-slate-200 shadow-xs hover:shadow-md transition-all flex items-center justify-between group cursor-pointer";

            if (item.type === 'folder') {
                card.innerHTML = `
                    <div class="flex items-center gap-3 truncate">
                        <span class="text-2xl">📁</span>
                        <span class="font-medium text-slate-700 group-hover:text-indigo-600 transition-colors truncate">${item.name}</span>
                    </div>
                    <span class="text-slate-400 text-sm group-hover:translate-x-1 transition-transform">→</span>`;
                card.onclick = () => {
                    currentPath.push(item.name);
                    render();
                };
            } else {
                let icon = '📄';
                let actionText = 'View';
                let actionClass = 'bg-indigo-50 text-indigo-600 hover:bg-indigo-100';

                if (item.name.endsWith('.docx') || item.name.endsWith('.doc')) {
                    icon = '📝';
                    actionText = 'Download';
                    actionClass = 'bg-emerald-50 text-emerald-600 hover:bg-emerald-100';
                }

                card.innerHTML = `
                    <div class="flex items-center gap-3 truncate">
                        <span class="text-2xl">${icon}</span>
                        <span class="font-medium text-slate-700 truncate">${item.name}</span>
                    </div>
                    <a href="${item.path}" target="_blank" rel="noopener noreferrer" 
                       class="text-xs px-3 py-1.5 rounded-md font-medium transition-colors ${actionClass}">
                       ${actionText}
                    </a>`;
            }
            return card;
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            isSearching = false;
            searchQuery = '';
            render();
        }

        // Initialize script on page load
        fetchRepoTree();
    </script>
</body>
</html>
