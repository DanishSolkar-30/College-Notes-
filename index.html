<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Notes Portal</title>
    <!-- Dynamic Theme Color Meta Tag -->
    <meta name="theme-color" content="#f8fafc" id="metaThemeColor">
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Explicit Theme Styling */
        body.light-theme { background-color: #f8fafc; color: #1e293b; }
        body.light-theme header, body.light-theme footer, body.light-theme .theme-sidebar { background-color: #ffffff; border-color: #e2e8f0; color: #1e293b; }
        body.light-theme .theme-card { background-color: #ffffff; border-color: #e2e8f0; color: #334155; }
        body.light-theme .theme-input { background-color: #f8fafc; border-color: #cbd5e1; color: #1e293b; }
        body.light-theme .sidebar-link:hover { background-color: #f1f5f9; color: #4f46e5; }
        body.light-theme .modal-bg { background-color: rgba(15, 23, 42, 0.5); }
        body.light-theme .skeleton-bg { background-color: #e2e8f0; }
        body.light-theme .toolbar-bg { background-color: rgba(241, 245, 249, 0.8); border-color: #cbd5e1; }
        
        body.dark-theme { background-color: #030712; color: #f1f5f9; }
        body.dark-theme header, body.dark-theme footer, body.dark-theme .theme-sidebar { background-color: #0f172a; border-color: #1e293b; color: #f1f5f9; }
        body.dark-theme .theme-card { background-color: #0f172a; border-color: #1e293b; color: #e2e8f0; }
        body.dark-theme .theme-input { background-color: #1e293b; border-color: #334155; color: #f1f5f9; }
        body.dark-theme .sidebar-link:hover { background-color: #1e293b; color: #818cf8; }
        body.dark-theme .modal-bg { background-color: rgba(3, 7, 18, 0.7); }
        body.dark-theme .skeleton-bg { background-color: #1e293b; }
        body.dark-theme .toolbar-bg { background-color: rgba(15, 23, 42, 0.8); border-color: #334155; }
    </style>
    <script>
        // Prevent theme flash on load
        const savedTheme = localStorage.getItem('theme') || 'light';
        if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    </script>
</head>
<body class="light-theme min-h-screen flex flex-col font-sans transition-colors duration-200">

    <!-- Header Section -->
    <header class="border-b py-4 px-6 md:px-8 shadow-xs sticky top-0 z-20 transition-colors duration-200">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center justify-between w-full sm:w-auto">
                <h1 class="text-xl font-bold tracking-tight flex items-center gap-2 cursor-pointer" onclick="navigateTo(-1)">
                    <span>📚</span> College Notes Portal
                </h1>
            </div>
            
            <div class="flex items-center gap-3 w-full sm:w-auto justify-end">
                <!-- Global Live Search Bar -->
                <div class="w-full sm:w-72">
                    <input type="text" id="searchInput" placeholder="Search any note or subject..." 
                        oninput="handleSearch(this.value)"
                        class="theme-input w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
                <!-- Dark Mode Toggle Button -->
                <button type="button" onclick="toggleDarkMode()" class="p-2.5 rounded-lg border theme-input hover:opacity-85 transition-opacity shrink-0 cursor-pointer" aria-label="Toggle Theme">
                    <span id="themeIcon" class="text-base pointer-events-none">🌙</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main App Layout (Sidebar + Content Container) -->
    <div class="max-w-7xl mx-auto w-full flex flex-col md:flex-row flex-grow">
        
        <!-- Sidebar Navigation -->
        <aside class="theme-sidebar w-full md:w-64 border-b md:border-b-0 md:border-r p-6 flex flex-col shrink-0 justify-between">
            <div>
                <!-- User Profile Header -->
                <div class="flex items-center gap-3 pb-6 mb-6 border-b">
                    <div class="w-10 h-10 rounded-full bg-indigo-500/10 text-indigo-500 flex items-center justify-center font-bold text-lg shrink-0">
                        DS
                    </div>
                    <div class="truncate">
                        <p class="font-semibold text-sm truncate">Danish Solkar</p>
                        <p class="text-xs opacity-60 truncate">Student Repository</p>
                    </div>
                </div>

                <h2 class="text-xs font-bold uppercase tracking-wider opacity-50 mb-3">Quick Navigation</h2>
                <nav id="sidebarNav" class="space-y-1">
                    <button onclick="navigateTo(-1)" class="sidebar-link w-full text-left px-3 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2 cursor-pointer">
                        <span>🏠</span> Home
                    </button>
                    <!-- Dynamically populated top-level folders -->
                </nav>
            </div>
            
            <div class="pt-6 mt-6 border-t text-xs opacity-50 text-center md:text-left">
                <span>Personal Notes Hub</span>
            </div>
        </aside>

        <!-- Main Dynamic Content Area -->
        <main class="flex-grow p-6 md:p-8 overflow-y-auto">
            
            <!-- Breadcrumb Navigation & Toolbar -->
            <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4 mb-6">
                <!-- Breadcrumb Navigation Bar -->
                <nav id="breadcrumb" aria-label="Breadcrumb" class="text-sm font-medium flex items-center gap-2 overflow-x-auto pb-1">
                    <!-- Dynamically populated -->
                </nav>

                <!-- Tools Toolbar (File Type Filter + View Mode Switcher) -->
                <div class="flex flex-wrap items-center gap-3 self-start lg:self-auto shrink-0">
                    <!-- File Type Filter Dropdown -->
                    <div class="flex items-center gap-1.5 toolbar-bg px-3 py-1.5 rounded-lg border transition-colors duration-200">
                        <span class="text-xs opacity-65 font-medium">Filter:</span>
                        <select id="fileTypeFilter" onchange="handleTypeFilter(this.value)" class="theme-input px-2 py-1 rounded-md text-xs font-medium border focus:outline-none focus:ring-1 focus:ring-indigo-500 cursor-pointer transition-colors duration-200">
                            <option value="all">All Files & Folders</option>
                            <option value="pdf">PDF (.pdf)</option>
                            <option value="docx">Word (.docx / .doc)</option>
                            <option value="ppt">Presentation (.pptx / .ppt)</option>
                            <option value="excel">Excel (.xlsx / .xls)</option>
                            <option value="image">Images (.png / .jpg)</option>
                            <option value="archive">Archives (.zip / .rar)</option>
                        </select>
                    </div>

                    <!-- View Mode Switcher Toolbar -->
                    <div class="toolbar-bg flex items-center gap-1 p-1 rounded-lg border transition-colors duration-200">
                        <button type="button" onclick="setViewMode('grid')" id="gridViewBtn" 
                            class="px-3 py-1.5 rounded-md text-xs font-medium transition-all flex items-center gap-1.5 cursor-pointer">
                            <span>🔲</span> Grid
                        </button>
                        <button type="button" onclick="setViewMode('list')" id="listViewBtn" 
                            class="px-3 py-1.5 rounded-md text-xs font-medium transition-all flex items-center gap-1.5 cursor-pointer">
                            <span>📋</span> List
                        </button>
                    </div>
                </div>
            </div>

            <!-- Content Grid/List Container -->
            <div id="contentGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Initial Loading Skeletons -->
                <div class="theme-card p-4 rounded-xl border flex items-center justify-between animate-pulse">
                    <div class="flex items-center gap-3 w-3/4">
                        <div class="w-10 h-10 rounded-lg skeleton-bg shrink-0"></div>
                        <div class="space-y-2 w-full">
                            <div class="h-4 skeleton-bg rounded w-3/4"></div>
                            <div class="h-3 skeleton-bg rounded w-1/2"></div>
                        </div>
                    </div>
                </div>
                <div class="theme-card p-4 rounded-xl border flex items-center justify-between animate-pulse hidden sm:flex">
                    <div class="flex items-center gap-3 w-3/4">
                        <div class="w-10 h-10 rounded-lg skeleton-bg shrink-0"></div>
                        <div class="space-y-2 w-full">
                            <div class="h-4 skeleton-bg rounded w-2/3"></div>
                            <div class="h-3 skeleton-bg rounded w-1/3"></div>
                        </div>
                    </div>
                </div>
                <div class="theme-card p-4 rounded-xl border flex items-center justify-between animate-pulse hidden lg:flex">
                    <div class="flex items-center gap-3 w-3/4">
                        <div class="w-10 h-10 rounded-lg skeleton-bg shrink-0"></div>
                        <div class="space-y-2 w-full">
                            <div class="h-4 skeleton-bg rounded w-4/5"></div>
                            <div class="h-3 skeleton-bg rounded w-1/4"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- File Preview Modal Overlay -->
    <div id="previewModal" class="fixed inset-0 modal-bg z-50 hidden flex items-center justify-center p-4 backdrop-blur-xs">
        <div class="theme-card w-full max-w-4xl h-[85vh] rounded-2xl border shadow-2xl flex flex-col overflow-hidden animate-in fade-in zoom-in-95 duration-150">
            <!-- Modal Header -->
            <div class="px-6 py-4 border-b flex items-center justify-between">
                <div class="flex items-center gap-3 truncate">
                    <span id="modalFileIcon" class="text-2xl">📄</span>
                    <h3 id="modalFileName" class="font-semibold text-base truncate">Document Preview</h3>
                </div>
                <div class="flex items-center gap-2">
                    <a id="modalDownloadBtn" href="#" target="_blank" rel="noopener noreferrer" 
                       class="text-xs px-3 py-1.5 rounded-md font-medium transition-colors bg-indigo-500 text-white hover:bg-indigo-600">
                       Download
                    </a>
                    <button type="button" onclick="closeModal()" class="p-1.5 rounded-lg opacity-70 hover:opacity-100 hover:bg-slate-500/10 cursor-pointer text-lg font-bold" aria-label="Close Modal">
                        ✕
                    </button>
                </div>
            </div>
            <!-- Modal Body Container -->
            <div id="modalBodyContainer" class="flex-grow bg-slate-100 dark:bg-slate-950 flex items-center justify-center relative overflow-hidden">
                <!-- Dynamically injected preview iframe or container -->
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="border-t py-4 text-center text-xs opacity-60 transition-colors duration-200">
        College Notes Repository • Auto-Synced via GitHub API
    </footer>

    <!-- Application Script Logic -->
    <script>
        const GITHUB_USER = "DanishSolkar-30";
        const GITHUB_REPO = "College-Notes-";
        
        let repoData = { name: "Home", type: "folder", children: [] };
        let currentPath = []; 
        let isSearching = false;
        let searchQuery = "";
        let selectedFileType = "all";
        let flatFileList = [];
        let viewMode = localStorage.getItem('viewMode') || 'grid';

        document.addEventListener("DOMContentLoaded", () => {
            const savedTheme = localStorage.getItem('theme') || 'light';
            setTheme(savedTheme, false);
            setViewMode(viewMode, false);
            fetchRepoTree();

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeModal();
            });
        });

        function toggleDarkMode() {
            const currentTheme = document.body.classList.contains('dark-theme') ? 'dark' : 'light';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            setTheme(newTheme, true);
        }

        function setTheme(theme, save = true) {
            const body = document.body;
            const iconSpan = document.getElementById('themeIcon');
            const metaThemeColor = document.getElementById('metaThemeColor');
            
            if (theme === 'dark') {
                body.classList.remove('light-theme');
                body.classList.add('dark-theme');
                if (iconSpan) iconSpan.textContent = '☀️';
                if (metaThemeColor) metaThemeColor.setAttribute('content', '#030712');
            } else {
                body.classList.remove('dark-theme');
                body.classList.add('light-theme');
                if (iconSpan) iconSpan.textContent = '🌙';
                if (metaThemeColor) metaThemeColor.setAttribute('content', '#f8fafc');
            }
            
            if (save) {
                localStorage.setItem('theme', theme);
            }
            
            updateViewModeButtonStyles();
        }

        function setViewMode(mode, save = true) {
            viewMode = mode;
            if (save) localStorage.setItem('viewMode', mode);

            updateViewModeButtonStyles();
            render();
        }

        function updateViewModeButtonStyles() {
            const gridBtn = document.getElementById('gridViewBtn');
            const listBtn = document.getElementById('listViewBtn');
            const isDark = document.body.classList.contains('dark-theme');

            if (viewMode === 'list') {
                gridBtn.className = `px-3 py-1.5 rounded-md text-xs font-medium transition-all flex items-center gap-1.5 cursor-pointer ${isDark ? 'text-slate-400 hover:text-white hover:bg-slate-800' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200'}`;
                listBtn.className = "px-3 py-1.5 rounded-md text-xs font-medium transition-all flex items-center gap-1.5 cursor-pointer shadow-xs bg-indigo-500 text-white";
            } else {
                listBtn.className = `px-3 py-1.5 rounded-md text-xs font-medium transition-all flex items-center gap-1.5 cursor-pointer ${isDark ? 'text-slate-400 hover:text-white hover:bg-slate-800' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-200'}`;
                gridBtn.className = "px-3 py-1.5 rounded-md text-xs font-medium transition-all flex items-center gap-1.5 cursor-pointer shadow-xs bg-indigo-500 text-white";
            }
        }

        async function fetchRepoTree() {
            try {
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/git/trees/main?recursive=1`);
                if (!response.ok) throw new Error("Failed to fetch repository tree");
                const data = await response.json();
                
                buildFileTree(data.tree);
                renderSidebar();
                render();
            } catch (err) {
                console.error(err);
                document.getElementById('contentGrid').innerHTML = `
                    <div class="theme-card col-span-full text-center py-12 text-red-500 rounded-xl border">
                        <p class="font-medium">Could not automatically load repository contents.</p>
                        <p class="text-xs opacity-75 mt-1">Please verify your repository configuration.</p>
                    </div>`;
            }
        }

        function buildFileTree(gitFiles) {
            let root = { name: "Home", type: "folder", children: [] };
            
            gitFiles.forEach(file => {
                if (file.path === "index.html" || file.path === "notes.json" || file.path.startsWith(".")) return;

                const parts = file.path.split("/");
                let currentLevel = root.children;

                parts.forEach((part, index) => {
                    let existingNode = currentLevel.find(item => item.name === part);
                    const isLast = index === parts.length - 1;

                    if (!existingNode) {
                        if (isLast && file.type === "blob") {
                            const rawUrl = `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/main/${file.path}`;
                            const newNode = { name: part, type: "file", path: rawUrl };
                            currentLevel.push(newNode);
                            flatFileList.push({ name: part, path: rawUrl });
                        } else {
                            const newNode = { name: part, type: "folder", children: [] };
                            currentLevel.push(newNode);
                            currentLevel = newNode.children;
                        }
                    } else {
                        if (!isLast) {
                            currentLevel = existingNode.children;
                        }
                    }
                });
            });

            repoData = root;
        }

        function renderSidebar() {
            const sidebarNav = document.getElementById('sidebarNav');
            let html = `
                <button onclick="navigateTo(-1)" class="sidebar-link w-full text-left px-3 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2 cursor-pointer ${currentPath.length === 0 && !isSearching ? 'bg-indigo-500/10 text-indigo-500 font-semibold' : ''}">
                    <span>🏠</span> Home
                </button>`;

            if (repoData && repoData.children) {
                repoData.children.forEach(item => {
                    if (item.type === 'folder') {
                        const isActive = currentPath.length > 0 && currentPath[0] === item.name && !isSearching;
                        html += `
                            <button onclick="currentPath = ['${item.name}']; isSearching = false; document.getElementById('searchInput').value=''; render(); renderSidebar();" 
                                class="sidebar-link w-full text-left px-3 py-2 rounded-lg text-sm font-medium transition-colors flex items-center gap-2 cursor-pointer ${isActive ? 'bg-indigo-500/10 text-indigo-500 font-semibold' : ''}">
                                <span>📁</span> <span class="truncate">${item.name}</span>
                            </button>`;
                    }
                });
            }
            sidebarNav.innerHTML = html;
        }

        function getCurrentFolder() {
            let current = repoData;
            for (let segment of currentPath) {
                if (!current.children) return null;
                current = current.children.find(c => c.name === segment);
                if (!current) return repoData;
            }
            return current;
        }

        function handleSearch(query) {
            searchQuery = query.trim();
            isSearching = searchQuery.length > 0;
            render();
            renderSidebar();
        }

        function handleTypeFilter(type) {
            selectedFileType = type;
            render();
        }

        function navigateTo(index) {
            if (index === -1) {
                currentPath = [];
            } else {
                currentPath = currentPath.slice(0, index + 1);
            }
            isSearching = false;
            document.getElementById('searchInput').value = '';
            render();
            renderSidebar();
        }

        function matchesFileType(filename, filterType) {
            if (filterType === 'all') return true;
            const lower = filename.toLowerCase();
            if (filterType === 'pdf') return lower.endsWith('.pdf');
            if (filterType === 'docx') return lower.endsWith('.docx') || lower.endsWith('.doc');
            if (filterType === 'ppt') return lower.endsWith('.pptx') || lower.endsWith('.ppt');
            if (filterType === 'excel') return lower.endsWith('.xlsx') || lower.endsWith('.xls');
            if (filterType === 'image') return lower.endsWith('.png') || lower.endsWith('.jpg') || lower.endsWith('.jpeg');
            if (filterType === 'archive') return lower.endsWith('.zip') || lower.endsWith('.rar');
            return true;
        }

        function render() {
            const grid = document.getElementById('contentGrid');
            const breadcrumb = document.getElementById('breadcrumb');
            grid.innerHTML = '';

            if (viewMode === 'list') {
                grid.className = "flex flex-col gap-2";
            } else {
                grid.className = "grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4";
            }

            if (isSearching) {
                breadcrumb.innerHTML = `
                    <span class="opacity-75 cursor-pointer hover:underline" onclick="navigateTo(-1)">Home</span>
                    <span class="opacity-40">/</span>
                    <span class="text-indigo-500 font-semibold">Search Results for "${searchQuery}"</span>`;

                let matchedFiles = flatFileList.filter(f => f.name.toLowerCase().includes(searchQuery.toLowerCase()));
                if (selectedFileType !== 'all') {
                    matchedFiles = matchedFiles.filter(f => matchesFileType(f.name, selectedFileType));
                }
                
                if (matchedFiles.length === 0) {
                    grid.innerHTML = `
                        <div class="theme-card col-span-full text-center py-16 rounded-xl border">
                            <p class="text-3xl mb-2">🔍</p>
                            <p class="font-medium">No matching notes found</p>
                        </div>`;
                    return;
                }

                matchedFiles.forEach(file => {
                    grid.appendChild(createCard(file));
                });
                return;
            }

            let bHtml = `<span class="opacity-75 cursor-pointer hover:underline" onclick="navigateTo(-1)">Home</span>`;
            currentPath.forEach((segment, index) => {
                bHtml += `<span class="opacity-40">/</span><span class="text-indigo-500 cursor-pointer hover:underline" onclick="navigateTo(${index})">${segment}</span>`;
            });
            breadcrumb.innerHTML = bHtml;

            const folder = getCurrentFolder();
            if (!folder || !folder.children || folder.children.length === 0) {
                grid.innerHTML = `
                    <div class="theme-card col-span-full text-center py-16 rounded-xl border">
                        <p class="text-3xl mb-2">📂</p>
                        <p class="font-medium">This folder is empty</p>
                    </div>`;
                return;
            }

            let itemsToDisplay = folder.children;
            if (selectedFileType !== 'all') {
                itemsToDisplay = itemsToDisplay.filter(item => {
                    if (item.type === 'folder') return true; 
                    return matchesFileType(item.name, selectedFileType);
                });
            }

            if (itemsToDisplay.length === 0) {
                grid.innerHTML = `
                    <div class="theme-card col-span-full text-center py-16 rounded-xl border">
                        <p class="text-3xl mb-2">🏷️</p>
                        <p class="font-medium">No items match the selected file type filter</p>
                    </div>`;
                return;
            }

            itemsToDisplay.forEach(item => {
                grid.appendChild(createCard(item));
            });
        }

        function createCard(item) {
            const card = document.createElement('div');
            
            if (viewMode === 'list') {
                card.className = "theme-card p-3.5 rounded-xl border shadow-xs hover:shadow-md transition-all flex items-center justify-between group cursor-pointer";
            } else {
                card.className = "theme-card p-4 rounded-xl border shadow-xs hover:shadow-md transition-all flex items-center justify-between group cursor-pointer";
            }

            if (item.type === 'folder') {
                card.innerHTML = `
                    <div class="flex items-center gap-3 truncate">
                        <span class="text-2xl">📁</span>
                        <span class="font-medium group-hover:text-indigo-500 transition-colors ${viewMode === 'list' ? 'whitespace-normal break-words text-sm' : 'truncate'}">${item.name}</span>
                    </div>
                    <span class="opacity-50 text-sm group-hover:translate-x-1 transition-transform shrink-0 ml-2">→</span>`;
                card.onclick = () => {
                    currentPath.push(item.name);
                    render();
                    renderSidebar();
                };
            } else {
                let icon = '📄';
                let badgeText = 'PDF';
                let badgeClass = 'bg-red-500/10 text-red-500';
                
                const lowerName = item.name.toLowerCase();
                if (lowerName.endsWith('.docx') || lowerName.endsWith('.doc')) {
                    icon = '📝';
                    badgeText = 'Word';
                    badgeClass = 'bg-blue-500/10 text-blue-500';
                } else if (lowerName.endsWith('.pptx') || lowerName.endsWith('.ppt')) {
                    icon = '📊';
                    badgeText = 'PPT';
                    badgeClass = 'bg-amber-500/10 text-amber-500';
                } else if (lowerName.endsWith('.xlsx') || lowerName.endsWith('.xls')) {
                    icon = '📈';
                    badgeText = 'Excel';
                    badgeClass = 'bg-emerald-500/10 text-emerald-500';
                } else if (lowerName.endsWith('.png') || lowerName.endsWith('.jpg') || lowerName.endsWith('.jpeg')) {
                    icon = '🖼️';
                    badgeText = 'Image';
                    badgeClass = 'bg-teal-500/10 text-teal-500';
                } else if (lowerName.endsWith('.zip') || lowerName.endsWith('.rar')) {
                    icon = '📦';
                    badgeText = 'Archive';
                    badgeClass = 'bg-purple-500/10 text-purple-500';
                }

                if (viewMode === 'list') {
                    card.innerHTML = `
                        <div class="flex items-center gap-3 min-w-0 pr-4 flex-grow">
                            <span class="text-2xl shrink-0">${icon}</span>
                            <div class="min-w-0 flex-grow">
                                <span class="font-medium text-sm block whitespace-normal break-words">${item.name}</span>
                                <span class="text-[10px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded ${badgeClass} inline-block mt-0.5">${badgeText}</span>
                            </div>
                        </div>
                        <button type="button" class="text-xs px-3 py-1.5 rounded-md font-medium transition-colors bg-indigo-500/10 text-indigo-500 hover:bg-indigo-500/20 shrink-0 ml-2 cursor-pointer">
                           Preview
                        </button>`;
                } else {
                    card.innerHTML = `
                        <div class="flex items-center gap-3 truncate">
                            <span class="text-2xl">${icon}</span>
                            <div class="truncate">
                                <span class="font-medium block truncate text-sm">${item.name}</span>
                                <span class="text-[10px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded ${badgeClass}">${badgeText}</span>
                            </div>
                        </div>
                        <button type="button" class="text-xs px-3 py-1.5 rounded-md font-medium transition-colors bg-indigo-500/10 text-indigo-500 hover:bg-indigo-500/20 shrink-0 ml-2 cursor-pointer">
                           Preview
                        </button>`;
                }
                
                card.onclick = (e) => {
                    e.stopPropagation();
                    openModal(item);
                };
            }
            return card;
        }

        function openModal(item) {
            const modal = document.getElementById('previewModal');
            const modalName = document.getElementById('modalFileName');
            const modalIcon = document.getElementById('modalFileIcon');
            const modalDownload = document.getElementById('modalDownloadBtn');
            const bodyContainer = document.getElementById('modalBodyContainer');

            modalName.textContent = item.name;
            modalDownload.href = item.path;

            const lowerName = item.name.toLowerCase();
            let icon = '📄';
            if (lowerName.endsWith('.docx') || lowerName.endsWith('.doc')) icon = '📝';
            else if (lowerName.endsWith('.pptx') || lowerName.endsWith('.ppt')) icon = '📊';
            else if (lowerName.endsWith('.xlsx') || lowerName.endsWith('.xls')) icon = '📈';
            else if (lowerName.endsWith('.png') || lowerName.endsWith('.jpg') || lowerName.endsWith('.jpeg')) icon = '🖼️';
            else if (lowerName.endsWith('.zip') || lowerName.endsWith('.rar')) icon = '📦';
            modalIcon.textContent = icon;

            bodyContainer.innerHTML = '';

            if (lowerName.endsWith('.pdf')) {
                const viewerUrl = `https://mozilla.github.io/pdf.js/web/viewer.html?file=${encodeURIComponent(item.path)}`;
                bodyContainer.innerHTML = `<iframe src="${viewerUrl}" class="w-full h-full border-0"></iframe>`;
            } else if (lowerName.endsWith('.png') || lowerName.endsWith('.jpg') || lowerName.endsWith('.jpeg')) {
                bodyContainer.innerHTML = `<img src="${item.path}" alt="${item.name}" class="max-w-full max-h-full object-contain rounded-lg p-2">`;
            } else {
                bodyContainer.innerHTML = `
                    <div class="text-center p-6">
                        <p class="text-4xl mb-3">${icon}</p>
                        <p class="font-semibold text-lg mb-1">Direct preview not available for this file type</p>
                        <p class="text-sm opacity-75 mb-4">You can download or view it directly in a new tab.</p>
                        <a href="${item.path}" target="_blank" rel="noopener noreferrer" 
                           class="inline-block px-4 py-2 bg-indigo-500 text-white font-medium rounded-lg text-sm hover:bg-indigo-600 transition-colors">
                           Open / Download File
                        </a>
                    </div>`;
            }

            modal.classList.remove('hidden');
        }

        function closeModal() {
            const modal = document.getElementById('previewModal');
            modal.classList.add('hidden');
            document.getElementById('modalBodyContainer').innerHTML = '';
        }
    </script>
</body>
</html>
